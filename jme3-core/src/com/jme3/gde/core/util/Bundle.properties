Editor.GuideOrbitTitle=Rotate the camera
Editor.GuideOrbitText=Hold the left mouse button and drag to rotate the camera. A simple click selects an object; dragging a transform handle edits the object instead.
Editor.GuideFlyTitle=Move through the scene
Editor.GuideFlyText=Hold the right mouse button and use W/A/S/D to move forward, left, backward and right. Move the mouse to look around. Release the right button to stop.
Editor.GuideVerticalTitle=Move up and down
Editor.GuideVerticalText=Hold the right mouse button and press Q to rise or Z to descend along the world vertical axis. Hold Shift to move faster.
Editor.GuideToolsTitle=Switch editing tools
Editor.GuideToolsText=Release both mouse buttons, then press Q to select, W to move, E to rotate or R to scale. The highlighted viewport icon shows the active tool. Open Guide to replay these steps anytime.

