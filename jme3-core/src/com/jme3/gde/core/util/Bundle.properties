Editor.HelpText=Scene editor controls\n\nLeft click: select; hold left mouse and drag to orbit the camera. Drag a handle to transform the object instead.\nWith neither mouse button held: Q: select/view; W: move; E: rotate; R: scale. T is unassigned (no Rect tool). The viewport buttons show the active tool. G hides/restores editor helpers (grid, selection outlines, handles, light icons and viewport statistics); it does not change the scene.\nHold right mouse: hide/capture the pointer and look around. Right mouse + WASD: fly; Q: ascend; Z: descend along world Y.\nShift: move faster. Release right mouse or leave the window: stop and restore the pointer.\nMiddle drag: orbit; Shift + middle: pan; wheel: zoom.\nCtrl+Z / Ctrl+Y: undo / redo; Ctrl+S: save.\n\nRender selects the lighting path; GPU tiled falls back to CPU when unavailable.\nView: Lit / Unlit / Normals / Wireframe / SDF / Collision.\nSDF displays baked samples; Collision displays existing shapes without simulating physics.\nDebug views use Forward; Lit restores the selected path without changing the asset.\nModel Detail contains bake options. The options menu refreshes the view or changes the theme.\nThe default is 60 FPS with renderer VSync disabled. The frame limit button offers 30 / 60 / 120 / Unlimited; FPS measures the actual preview loop.\nStats toggles detailed renderer statistics. Hidden previews still throttle to save power.

