# Compact SDK editor palette, layered over the bundled Apache-2.0 FlatLaf.
@background = #23262b
@foreground = #d5dbe3
@componentBackground = #1c1f24
@buttonBackground = #30353d
@menuBackground = #252a31
@accentColor = #397bb8
Component.borderColor = #3b414a
Component.focusedBorderColor = #528fca
ToolBar.background = #20242a
Tree.background = #25292f
Table.background = #25292f
EditorTab.background = #20242a
EditorTab.selectedBackground = #303741
EditorTab.activeBackground = #303741
EditorTab.hoverBackground = #343b45
ViewTab.background = #20242a
ViewTab.selectedBackground = #303741
ViewTab.activeBackground = #303741
ViewTab.hoverBackground = #343b45
TabbedContainer.editor.contentBorderColor = #363c45
TabbedContainer.view.contentBorderColor = #363c45
