Animation.GuideBody=Animation Editor Guide\n\nA Composer owns clips and controls targets referenced by their tracks, which may lie outside its node hierarchy. Multiple Composers writing to the same target can overwrite each other; they do not blend automatically. A character typically keeps Idle, Walk, Run and Attack in one Composer. Each graph here belongs to one Composer; cross-Composer orchestration and layered skeletal masking are not implemented.\nA clip is imported animation data. A clip state references that data; two states using the same clip do not create new motions. Entry is the first state played.\n\n1. Select a Composer and inspect the clip diagnostics below. Preview source clip tests motion independently without changing the graph.\n2. Optionally enable Show skeleton / targets (off by default). Cyan shows the skeleton, orange shows joints directly referenced by any clip in the selected Composer, and purple shows ordinary node targets. The overlay follows animation, is visible through the model, and is never saved to J3O. It does not show morph vertices or imply inherited influence.\n3. Add a state in States / 1D blend. Use an actual clip name, threshold 0 and an empty blend parameter for a single clip. The first state becomes Entry automatically.\n4. Apply preview to play the graph. One state is sufficient; no transitions are needed. Pause stops playback, Play resumes it, and Reset restarts from Entry.\n5. Parameters declares Float numbers, Boolean values and one-shot Triggers. Reapply preview after changing definitions, then adjust Live parameters. Game Java code updates the same parameters at runtime. Parameters with no references do not affect animation.\n6. For example, declare Boolean Moving with default False. Connect Idle to Move with Is true, and Move to Idle with Is false; use exit time -1. Apply preview and toggle Moving. Use distinct moving clips; paused playback must be resumed.\n7. Transitions specifies source, target, parameter, condition and comparison value. Fade is the blend duration in seconds. Exit is elapsed seconds before leaving; -1 disables that restriction. The first matching row wins; active fades cannot be interrupted. Unconditional transitions in both directions repeatedly restart clips.\n8. For 1D blend use clips Idle|Walk|Run, thresholds 0|1|2 and Float parameter Speed. Speed=0.5 blends Idle and Walk inside one state. All clips must exist in the selected Composer. This does not provide upper/lower body layering.\n9. For state switching, Idle to Walk can use Speed Greater than 0.1, and Walk to Idle Speed Less than 0.1. Adding states does not generate missing animation data.\n10. Save J3O stores the graph. An empty graph remains editable but cannot be saved as a playable graph; Ctrl+Z restores deleted states. Deleting states never deletes imported clips.\n\nIf the source clip is motionless, check its duration, keyframe changes and Composer ownership. Names alone do not indicate motion.\n\nSource clips in the selected Composer:\n
