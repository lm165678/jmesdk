f\u4e0d\u8868\u793a\u7236\u5b50\u5c42\u7ea7\u7684\u95f4\u63a5\u5f71\u54cd\u8303\u56f4\u3002\n\u7b2c\u4e09\u6b65\uff1a\u5728\u201c\u72b6\u6001 / \u4e00\u7ef4\u6df7\u5408\u201d\u4e2d\u6dfb\u52a0\u72b6\u6001\u3002\u5355\u7247\u6bb5\u586b\u5199\u5b9e\u9645\u7247\u6bb5\u540d\uff0c\u9608\u503c\u586b 0\uff0c\u6df7\u5408\u53c2\u6570\u7559\u7a7a\u3002\u9996\u4e2a\u72b6\u6001\u81ea\u52a8\u8bbe\u4e3a\u5165\u53e3\u3002\n\u7b2c\u56db\u6b65\uff1a\u70b9\u51fb\u201c\u5e94\u7528\u9884\u89c8\u201d\u3002\u4e00\u4e2a\u6709\u6548\u72b6\u6001\u5373\u53ef\u64ad\u653e\uff0c\u4e0d\u9700\u8981\u8fde\u7ebf\u3002\u201c\u6682\u505c\u201d\u505c\u6b62\u64ad\u653e\uff0c\u201c\u64ad\u653e\u201d\u7ee7\u7eed\uff0c\u201c\u91cd\u7f6e\u201d\u4ece\u5165\u53e3\u91cd\u64ad\u3002\n\u7b2c\u4e94\u6b65\uff1a\u201c\u53c2\u6570\u201d\u4e2d\u5b9a\u4e49\u6d6e\u70b9\u6570\u3001\u5e03\u5c14\u503c\u548c\u4e00\u6b21\u6027\u89e6\u53d1\u5668\u3002\u4fee\u6539\u5b9a\u4e49\u540e\u91cd\u65b0\u5e94\u7528\u9884\u89c8\uff0c\u518d\u8c03\u6574\u5b9e\u65f6\u53c2\u6570\u3002\u6e38\u620f\u4e2d\u7684 Java \u4ee3\u7801\u8d1f\u8d23\u66f4\u65b0\u540c\u540d\u53c2\u6570\u3002\u6ca1\u6709\u88ab\u5f15\u7528\u7684\u53c2\u6570\u4e0d\u4f1a\u5f71\u54cd\u52a8\u753b\u3002\n\u7b2c\u516d\u6b65\uff1a\u4f8b\u5982\u5b9a\u4e49\u5e03\u5c14\u53c2\u6570\u201c\u79fb\u52a8\u201d\uff0c\u9ed8\u8ba4\u5047\u3002\u5f85\u673a\u5230\u79fb\u52a8\u7684\u6761\u4ef6\u8bbe\u4e3a\u201c\u4e3a\u771f\u201d\uff0c\u53cd\u5411\u6761\u4ef6\u8bbe\u4e3a\u201c\u4e3a\u5047\u201d\uff0c\u9000\u51fa\u65f6\u95f4\u586b -1\u3002\u5e94\u7528\u9884\u89c8\u540e\u52fe\u9009\u8be5\u53c2\u6570\u8fdb\u5165\u79fb\u52a8\uff0c\u53d6\u6d88\u52fe\u9009\u56de\u5230\u5f85\u673a\u3002\u4e24\u7aef\u9700\u4f7f\u7528\u53ef\u533a\u5206\u7684\u52a8\u4f5c\uff1b\u6682\u505c\u65f6\u5148\u6062\u590d\u64ad\u653e\u3002\u793a\u4f8b\u4e2d\u7684\u540d\u79f0\u9700\u66ff\u6362\u4e3a\u6a21\u578b\u5b9e\u9645\u7247\u6bb5\u540d\u3002\n\u7b2c\u4e03\u6b65\uff1a\u201c\u8f6c\u6362\u201d\u4e2d\u8bbe\u7f6e\u8d77\u59cb\u72b6\u6001\u3001\u76ee\u6807\u72b6\u6001\u3001\u53c2\u6570\u3001\u6761\u4ef6\u548c\u6bd4\u8f83\u503c\u3002\u8fc7\u6e21\u65f6\u957f\u4ee5\u79d2\u8ba1\uff1b\u9000\u51fa\u65f6\u95f4\u4e3a\u6700\u65e9\u5141\u8bb8\u79bb\u5f00\u7684\u5df2\u64ad\u653e\u79d2\u6570\uff0c-1 \u8868\u793a\u4e0d\u9650\u3002\u4f18\u5148\u4f7f\u7528\u9760\u4e0a\u7684\u5339\u914d\u89c4\u5219\uff0c\u6b63\u5728\u8fdb\u884c\u7684\u8fc7\u6e21\u4e0d\u53ef\u6253\u65ad\u3002\u53cc\u5411\u65e0\u6761\u4ef6\u8f6c\u6362\u4f1a\u53cd\u590d\u91cd\u542f\u52a8\u753b\u3002\n\u7b2c\u516b\u6b65\uff1a\u4e00\u7ef4\u6df7\u5408\u53ef\u586b\u5199\u7247\u6bb5\u201c\u5f85\u673a|\u884c\u8d70|\u8dd1\u6b65\u201d\uff0c\u9608\u503c\u201c0|1|2\u201d\uff0c\u6d6e\u70b9\u6570\u6df7\u5408\u53c2\u6570\u201c\u901f\u5ea6\u201d\u3002\u901f\u5ea6\u4e3a 0.5 \u65f6\u5728\u540c\u4e00\u72b6\u6001\u5185\u6df7\u5408\u5f85\u673a\u4e0e\u884c\u8d70\u3002\u6240\u6709\u7247\u6bb5\u5fc5\u987b\u5c5e\u4e8e\u6240\u9009\u63a7\u5236\u5668\uff1b\u8fd9\u4e0d\u7b49\u4e8e\u4e0a\u4e0b\u534a\u8eab\u5206\u5c42\u3002\n\u7b2c\u4e5d\u6b65\uff1a\u5f85\u673a\u5230\u884c\u8d70\u53ef\u4f7f\u7528\u201c\u901f\u5ea6\u5927\u4e8e 0.1\u201d\uff0c\u53cd\u5411\u4f7f\u7528\u201c\u901f\u5ea6\u5c0f\u4e8e 0.1\u201d\u3002\u65b0\u589e\u72b6\u6001\u4e0d\u4f1a\u81ea\u52a8\u751f\u6210\u7f3a\u5931\u7684\u52a8\u753b\u6570\u636e\u3002\n\u7b2c\u5341\u6b65\uff1a\u201c\u4fdd\u5b58 J3O\u201d\u4fdd\u5b58\u884c\u4e3a\u56fe\u3002\u7a7a\u56fe\u53ef\u7ee7\u7eed\u7f16\u8f91\uff0c\u4f46\u4e0d\u80fd\u4f5c\u4e3a\u53ef\u64ad\u653e\u72b6\u6001\u673a\u4fdd\u5b58\uff1bCtrl+Z \u53ef\u6062\u590d\u5220\u9664\u3002\u5220\u9664\u72b6\u6001\u4e0d\u4f1a\u5220\u9664\u5bfc\u5165\u7684\u6e90\u7247\u6bb5\u3002\n\n\u82e5\u6e90\u7247\u6bb5\u4e5f\u4e0d\u52a8\uff0c\u8bf7\u68c0\u67e5\u65f6\u957f\u3001\u5173\u952e\u5e27\u662f\u5426\u53d8\u5316\uff0c\u4ee5\u53ca\u7247\u6bb5\u662f\u5426\u5c5e\u4e8e\u5176\u4ed6\u63a7\u5236\u5668\u3002\u540d\u79f0\u672c\u8eab\u4e0d\u80fd\u4fdd\u8bc1\u5b58\u5728\u8fd0\u52a8\u3002\n\n\u5f53\u524d\u5