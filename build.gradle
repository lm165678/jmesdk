def dep(coords, javadoc = false, sources = false) {
    def result = [dependencies.create(coords)]
    def localArtifact = coords instanceof CharSequence && coords.toString().startsWith('org.jmonkeyengine:')
            && localEngineModules.contains(coords.toString().split(':')[1])
    if (javadoc && !localArtifact) result << dependencies.create("$coords:javadoc")
    if (sources) result << dependencies.create("$coords:sources")
    result
}

