tasks.register('prepareTextureTools') {
    group = 'build setup'
    description = 'Verifies and unpacks the versioned native texture encoder archives.'
    inputs.files(textureToolPackages.collect { file("third-party/texture-tools/${it.archive}") })
    inputs.files(textureJniBundles)
    inputs.property('expectedHashes', textureToolPackages.collect { "${it.archive}|${it.sha256}" })
    outputs.files(textureToolBinaries)
    outputs.dir('jme3-texture-tools/release/texture-tools/jni')
    doLast {
        textureToolPackages.each { tool ->
            def archive = file("third-party/texture-tools/${tool.archive}")
            if (!archive.isFile()) {
                throw new GradleException("Missing versioned texture tool archive: ${archive}")
            }
            if (!getSHA256Hash(archive).equalsIgnoreCase(tool.sha256)) {
                throw new GradleException("Texture tool checksum verification failed: ${archive}")
            }
            copy {
                from(tool.archive.endsWith('.tar.gz') ? tarTree(resources.gzip(archive)) : zipTree(archive))
                into tool.destination
                includeEmptyDirs = false
            }
        }
        textureToolBinaries.each { binary ->
            if (!file(binary).isFile()) {
                throw new GradleException("Texture tool package has an unexpected layout; missing ${binary}")
            }
        }
        project.sync { spec ->
            spec.from(textureJniBundles.files.collect { zipTree(it) })
            spec.into('jme3-texture-tools/release/texture-tools/jni')
            spec.include('windows-*/jme-texture-codec.dll', 'linux-*/libjme-texture-codec.so',
                    'macos-*/libjme-texture-codec.dylib', '*/LICENSE-*.txt')
        }
    }
}

def ufbxNatives = [
        'windows-x86_64': 'jme-ufbx.dll',
        'windows-arm64': 'jme-ufbx.dll',
        'linux-x86_64': 'libjme-ufbx.so',
        'linux-arm64': 'libjme-ufbx.so',
        'macos-x86_64': 'libjme-ufbx.dylib',
        'macos-arm64': 'libjme-ufbx.dylib'
]
def ufbxBundleDir = providers.gradleProperty('ufbxNativeBundles').getOrElse('build/ufbx-jni/bundles')
def ufbxReleaseDir = file('jme3-autodesk/release/lib/ufbx')

tasks.register('prepareUfbxNatives') {
    group = 'build setup'
    description = 'Collects precompiled ufbx and xatlas JNI libraries for the SDK.'
    doLast {
        def requireAll = providers.gradleProperty('requireUfbxNatives').getOrElse('false').toBoolean()
        def filesByTarget = ufbxNatives.collectEntries { platform, library ->
            [(platform): [library, 'LICENSE-ufbx.txt']]
        }
        filesByTarget.each { platform, filenames ->
            def input = file("${ufbxBundleDir}/${platform}")
            if (!input.isDirectory() && !requireAll) {
                return
            }
            def required = requireAll ? filenames + [filenames[0].replace('ufbx', 'xatlas'), 'LICENSE-xatlas.txt'] : filenames
            required.each { name ->
                def artifact = new File(input, name)
                if (!artifact.isFile() || artifact.length() == 0) {
                    throw new GradleException("Incomplete SDK JNI bundle for ${platform}: missing ${artifact}")
                }
            }
        }
        filesByTarget.each { platform, filenames ->
            def input = file("${ufbxBundleDir}/${platform}")
            if (input.isDirectory()) {
                copy {
                    from input
                    include filenames
                    into new File(ufbxReleaseDir, platform)
                }
                def xatlasFiles = [filenames[0].replace('ufbx', 'xatlas'), 'LICENSE-xatlas.txt']
                copy {
                    from input
                    include xatlasFiles
                    into file("jme3-core/release/lib/xatlas/${platform}")
                }
            }
        }
    }
}

tasks.register('verifyLocalEngine') {
    group = 'verification'
    description = 'Checks the local engine coordinates and required custom feature classes.'
    doLast {
        if (!localEngineEnabled) {
            throw new GradleException('This SDK fork requires the custom local engine.')
        }
        def libraries = configurations.corelibs.resolvedConfiguration.resolvedArtifacts
        def required = [
            'jme3-core': ['com/jme3/renderer/pipeline/FrameGraphPipeline.class',
                          'com/jme3/renderer/RenderPath.class',
                          'com/jme3/environment/gi/ProbeLightmapControl.class',
                          'com/jme3/environment/gi/ProbeLightmapAsset.class',
                          'com/jme3/scene/Mobility.class'],
            'jme3-plugins': ['com/jme3/scene/plugins/sdf/SdfVolume.class',
                             'com/jme3/scene/plugins/sdf/SurfaceBakeData.class']
        ]
        required.each { module, entries ->
            def artifact = libraries.find { it.name == module && !it.classifier }
            if (artifact == null || artifact.moduleVersion.id.version != localEngineVersion) {
                throw new GradleException('Missing local engine module: ' + module)
            }
            new ZipFile(artifact.file).withCloseable { jar ->
                entries.each { entry ->
                    if (jar.getEntry(entry) == null) {
                        throw new GradleException(module + ' does not contain ' + entry)
                    }
                }
            }
        }
        [configurations.corelibs, configurations.optlibs, configurations.examplelibs,
                configurations.testdatalibs].each { configuration ->
            configuration.resolvedConfiguration.resolvedArtifacts.each { artifact ->
                if (artifact.moduleVersion.id.group == 'org.jmonkeyengine'
                        && localEngineModules.contains(artifact.name)
                        && artifact.moduleVersion.id.version != localEngineVersion) {
                    throw new GradleException('Mixed engine versions: ' + artifact.moduleVersion.id)
                }
            }
        }
        def report = file('build/local-engine-libraries.txt')
        report.parentFile.mkdirs()
        report.text = libraries.findAll { !it.classifier }.collect {
            it.moduleVersion.id.toString() + ' -> ' + it.file.absolutePath
        }.sort().join(System.lineSeparator()) + System.lineSeparator()
        logger.lifecycle('LOCAL_ENGINE_VERIFY_PASS ' + localEngineVersion)
    }
}

