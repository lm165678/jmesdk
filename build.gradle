tasks.named('copyBaseLibs') {
    doLast {
        def directory = file('jme3-core-libraries/release/modules/ext')
        ['windows-x86_64', 'linux-x86_64', 'linux-arm64', 'macosx-x86_64', 'macosx-arm64'].each { target ->
            ['ffmpeg-7.1.1-1.5.12', 'javacpp-1.5.12'].each { library ->
                def archive = new File(directory, "${library}-${target}.jar")
                if (!archive.isFile()) {
                    throw new GradleException("Missing audio JNI distribution: ${archive.name}")
                }
                new ZipFile(archive).withCloseable { zip ->
                    if (!zip.entries().find { it.name.endsWith('.dll') || it.name.endsWith('.so') || it.name.endsWith('.dylib') }) {
                        throw new GradleException("Audio JNI archive has no native library: ${archive.name}")
                    }
                }
            }
        }
        ['NOTICE.txt', 'JavaCV-LICENSE.txt', 'JavaCPP-LICENSE.txt', 'FFmpeg-LICENSE.md',
         'FFmpeg-COPYING.LGPLv3', 'FFmpeg-COPYING.GPLv3', 'Vorbis-COPYING', 'Ogg-COPYING'].each { notice ->
            if (!file("jme3-core-libraries/release/licenses/audio-import/${notice}").isFile()) {
                throw new GradleException("Missing media license: ${notice}")
            }
        }
    }
}
