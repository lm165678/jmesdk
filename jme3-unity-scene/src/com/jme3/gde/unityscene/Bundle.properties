OpenIDE-Module-Name=Unity Scene Importer
OpenIDE-Module-Short-Description=Imports Unity .unity scenes and .prefab assets as jMonkeyEngine scene graphs
OpenIDE-Module-Long-Description=Converts Unity YAML scene hierarchies, transforms, mesh renderers, materials, textures, basic lights and prefab instances into JME Spatial trees. The existing Convert Model action saves the result as J3O. Unity scripts, terrain, UI, baked lighting and arbitrary component overrides are not converted.
